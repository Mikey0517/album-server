server:
  port: 8000
  servlet:
    context-path: ${CONTEXT_PATH:}
  tomcat:
    max-http-form-post-size: 600MB
    max-swallow-size: 600MB

spring:
  datasource:
    url: jdbc:sqlite:${DATA_DIR:/data}/app.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 10000
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB

album:
  data-dir: ${DATA_DIR:/data}
  max-upload-size: ${MAX_UPLOAD_SIZE:524288000}
  token-days: ${TOKEN_DAYS:30}
  allowed-origins: ${ALLOWED_ORIGINS:*}
  upload-secret: ${UPLOAD_SECRET:change-me-in-production}

ios:
  # iPad 不能自装 IPA：版本号和下载地址优先从 GitHub Release 的 ios-<版本>-<build> 读，
  # 读不到时退回下面这三个静态值（TestFlight 链接也可以填在这里）。
  release-repo: ${IOS_RELEASE_REPO:Mikey0517/album-app}
  # 设备实际下载的地址前缀（走自家域名，避免直连 GitHub 资源域超时）
  public-base-url: ${PUBLIC_BASE_URL:https://album.mikeyxu.top:8443}
  update-url: ${IOS_UPDATE_URL:}
  version-code: ${IOS_VERSION_CODE:0}
  version-name: ${IOS_VERSION_NAME:}

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-flash

logging:
  level:
    root: INFO
    com.example.album: INFO
